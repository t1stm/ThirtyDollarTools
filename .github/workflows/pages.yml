name: Deploy site to GitHub Pages

# The deploy bakes the latest release data into index.html (site/prerender.mjs) for crawlers and
# no-JS visitors; the page still fetches it live on load. So besides site changes, redeploy once a
# release's zips are attached (not on `release`, which fires before they exist) and daily for nightlies.
on:
  push:
    branches: [ master ]
    paths: [ 'site/**', '.github/workflows/pages.yml' ]
  workflow_run:
    workflows: [ 'Attach Binaries to Release' ]
    types: [ completed ]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check release logic
        run: node site/releases.test.mjs

      - name: Pre-render release data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node site/prerender.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
