name: Attach Binaries to Release

on:
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        platform: [ linux-x64, win-x64, osx-x64, osx-arm64 ]
        include:
          - net_version: "net10.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Create build directories
        run: mkdir -p bin/${{ matrix.platform }}-Release

      - name: Publish ThirtyDollarConverter.GUI
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: |
          dotnet publish ./Converter/ThirtyDollarConverter.GUI/ThirtyDollarConverter.GUI.csproj \
            -c Release \
            -f ${{ matrix.net_version }} \
            -r ${{ matrix.platform }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o ./bin/${{ matrix.platform }}-Release

      - name: Publish ThirtyDollarVisualizer
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: |
          dotnet publish ./Visualizer/ThirtyDollarVisualizer/ThirtyDollarVisualizer.csproj \
            -c Release \
            -f ${{ matrix.net_version }} \
            -r ${{ matrix.platform }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:IncludeAllContentForSelfExtract=true \
            -o ./bin/${{ matrix.platform }}-Release

      - name: Clean up build artifacts
        run: |
          cd "./bin/${{ matrix.platform }}-Release"
          rm -rf ./*.dll ./*.dylib ./*.so ./runtimes ./*.pdb

      - name: Archive platform build
        run: |
          mkdir -p dist
          (cd "./bin/${{ matrix.platform }}-Release" && \
            zip -r "${GITHUB_WORKSPACE}/dist/ThirtyDollarTools-${{ matrix.platform }}-Release.zip" .)

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
